 $('tabs').innerHTML=fls.map(f=>{const x=L.filter(l=>l.fl==f),q=x.reduce((a,l)=>a+l.qty,0),d=x.reduce((a,l)=>a+l.done,0);
  return `<div class="tab ${f==floor?'on':''}" data-f="${f}"><b>Этаж ${f}</b><small>${pct(d,q)}% · ${d}/${q}</small></div>`}).join('');
 document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{floor=+t.dataset.f;try{localStorage.setItem('floor',floor)}catch(e){};render();scrollTo(0,0)});
 const q=$('q').value.trim().toLowerCase(), hide=$('hide').checked, rooms={};
 L.filter(l=>q?(l.room+' '+l.rname).toLowerCase().includes(q):l.fl==floor).forEach(l=>(rooms[l.room]=rooms[l.room]||[]).push(l));
 const ae=document.activeElement, keep=ae&&ae.dataset&&ae.dataset.room;
 if(keep)return; // не перерисовывать, пока человек пишет замечание
 $('list').innerHTML=Object.entries(rooms).map(([room,it])=>{const rq=it.reduce((a,l)=>a+l.qty,0),rd=it.reduce((a,l)=>a+l.done,0),full=rd===rq;
  if(hide&&full)return'';
  return `<div class="room ${full?'done':''}"><div class="rh"><div><b>${esc(room)}</b> <span class="n">${q?'эт. '+it[0].fl+' · ':''}${esc(it[0].rname)}</span></div><div class="p">${full?'✓ готово':pct(rd,rq)+'%'}</div></div>`+
  it.map(l=>`<div class="it ${l.done===l.qty?'full':''}"><div class="t"><div>${esc(l.item)}</div><small>${esc(l.code)} · нужно ${l.qty} шт<span class="badge b-${l.st.replace(' ','')}">${esc(l.st)}</span></small></div>
   <div class="st"><button data-id="${l.id}" data-d="-1">−</button><span class="v" data-v="${l.id}" title="нажмите, чтобы ввести число">${l.done}/${l.qty}</span><button data-id="${l.id}" data-d="1">+</button><button class="all" data-id="${l.id}" data-all>${l.done===l.qty?'✓':'все'}</button></div></div>`).join('')+
  `<div class="rf"><input data-room="${esc(room)}" placeholder="Замечание (брак, нет деталей…)" value="${esc(S.notes[room]||'')}">${full?'':`<button data-room-all="${esc(room)}">Всё готово</button>`}</div></div>`}).join('')||'<p>Ничего не найдено</p>';
 document.querySelectorAll('.st button').forEach(b=>b.onclick=()=>{const l=S.lines.find(x=>x.id==b.dataset.id);
  if('all' in b.dataset)setDone(l.id,l.done===l.qty?0:l.qty);else setDone(l.id,l.done+ +b.dataset.d)});
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(needWho())return;const l=S.lines.find(x=>x.id==b.dataset.v);const v=prompt(l.item+' — сколько собрано (из '+l.qty+')?',l.done);if(v!==null&&v.trim()!==''&&!isNaN(+v))setDone(l.id,parseInt(v))});
 document.querySelectorAll('[data-room-all]').forEach(b=>b.onclick=()=>{if(needWho())return;if(!confirm('Отметить всё помещение '+b.dataset.roomAll+' собранным?'))return;
  S.lines.filter(l=>l.room===b.dataset.roomAll).forEach(l=>setDone(l.id,l.qty))});
 document.querySelectorAll('input[data-room]').forEach(i=>i.onchange=()=>saveNote(i.dataset.room,i.value.trim()));
 if(ADMIN)renderAdmin();
}
function renderAdmin(){const L=S.lines,by={};L.forEach(l=>{const k=l.item;by[k]=by[k]||{q:0,d:0};by[k].q+=l.qty;by[k].d+=l.done});
 const f=t=>new Date(t*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
 $('admin').innerHTML='<h3>По позициям</h3><table class="sum"><tr><th>Позиция</th><th>Собрано</th><th>%</th></tr>'+
  Object.entries(by).sort((a,b)=>b[1].q-a[1].q).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.d}/${v.q}</td><td>${pct(v.d,v.q)}%</td></tr>`).join('')+'</table>'+
  '<h3>Журнал отметок</h3><div class="log">'+((S.log||[]).map(g=>`<div>${f(g.ts)} · <b>${esc(g.who)}</b> · ${esc(g.room)} · ${esc(g.item)}${g.qty?` · ${g.before}→${g.after} из ${g.qty}`:''}</div>`).join('')||'пока пусто')+'</div>'}
$('q').oninput=render;$('hide').onchange=render;
saveLocal();render();flush().then(load);setInterval(()=>{flush().then(load)},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
</script></body></html>
